name: Build and Release LaTeX

on:
    release:
        types: [published]

jobs:
    build:
        runs-on: ubuntu-latest
        container: texlive/texlive:latest
        permissions:
            contents: write

        steps:
            - uses: actions/checkout@v3

            - name: Extract release title from slides.tex
              id: title
              run: |
                    SUBTITLE=$(grep -oE '\\subtitle\{[^}]*\}' vibe_coding/slides.tex | head -1 | sed 's/\\subtitle{\(.*\)}/\1/')
                    DATE=$(grep -oE '\\date\{[^}]*\}' vibe_coding/slides.tex | head -1 | sed 's/\\date{\(.*\)}/\1/')
                    echo "Extracted SUBTITLE: [$SUBTITLE]"
                    echo "Extracted DATE: [$DATE]"
                    if [ -z "$SUBTITLE" ] || [ -z "$DATE" ]; then
                      echo "::error::Failed to extract subtitle or date from vibe_coding/slides.tex"
                      exit 1
                    fi
                    echo "SUBTITLE=$SUBTITLE" >> "$GITHUB_OUTPUT"
                    echo "DATE=$DATE" >> "$GITHUB_OUTPUT"

            - run: cd coding_assistants && make
            - run: cd vibe_coding && make

            - name: Update release title
              uses: actions/github-script@v7
              with:
                github-token: ${{ secrets.GITHUB_TOKEN }}
                script: |
                    const { data: release } = await github.rest.repos.getReleaseByTag({
                      owner: context.repo.owner,
                      repo: context.repo.repo,
                      tag: context.payload.release.tag_name,
                    });
                    const name = '${{ steps.title.outputs.SUBTITLE }}. ${{ steps.title.outputs.DATE }}';
                    await github.rest.repos.updateRelease({
                      owner: context.repo.owner,
                      repo: context.repo.repo,
                      release_id: release.id,
                      name: name,
                    });
                    console.log(`Release title updated to: ${name}`);

            - name: Upload coding_assistants PDF as Release Asset
              uses: actions/upload-release-asset@v1
              env:
                GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              with:
                upload_url: ${{ github.event.release.upload_url }}
                asset_path: ./coding_assistants/slides.pdf
                asset_name: coding_assistants.pdf
                asset_content_type: application/pdf

            - name: Upload vibe_coding PDF as Release Asset
              uses: actions/upload-release-asset@v1
              env:
                GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              with:
                upload_url: ${{ github.event.release.upload_url }}
                asset_path: ./vibe_coding/slides.pdf
                asset_name: vibe_coding.pdf
                asset_content_type: application/pdf
